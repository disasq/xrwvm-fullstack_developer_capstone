apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership
  labels:
    app: dealership
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dealership
  template:
    metadata:
      labels:
        app: dealership
    spec:
      containers:
        - name: web
          image: us.icr.io/sn-labs-donnaleez800/dealership:latest
          ports:
            - containerPort: 8000
          env:
            - name: backend_url
              value: http://127.0.0.1:3030
            - name: sentiment_analyzer_url
              value: http://127.0.0.1:5050
            - name: DJANGO_DEBUG
              value: '0'
            - name: DJANGO_ALLOWED_HOSTS
              value: localhost,127.0.0.1,.labs.cognitiveclass.ai,.proxy.cognitiveclass.ai,.skills.network
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dealership-secret
                  key: secret-key
            - name: DJANGO_CSRF_TRUSTED_ORIGINS
              value: https://donnaleez800-8003.theiadockernext-1-labs-prod-theiak8s-4-tor01.proxy.cognitiveclass.ai
          readinessProbe:
            httpGet:
              path: /
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: api
          image: us.icr.io/sn-labs-donnaleez800/dealership-api:latest
          env:
            - name: MONGO_URL
              value: mongodb://127.0.0.1:27017/dealershipsDB
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: sentiment
          image: us.icr.io/sn-labs-donnaleez800/dealership-sentiment:latest
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
        - name: mongo
          image: mongo:7
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mongo-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dealership
spec:
  selector:
    app: dealership
  ports:
    - port: 8000
      targetPort: 8000
